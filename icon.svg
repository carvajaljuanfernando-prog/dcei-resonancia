<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DCEI y Resonancia Magnética">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212c"/>
      <stop offset="1" stop-color="#0b1219"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a3b5"/>
      <stop offset="1" stop-color="#0a5f6b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- anillo del túnel de resonancia -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30" opacity=".95"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#0d7d8c" stroke-width="10" opacity=".38"/>

  <!-- generador del dispositivo -->
  <rect x="150" y="186" width="86" height="62" rx="22" fill="#e8f4f6"/>
  <rect x="167" y="203" width="52" height="28" rx="12" fill="#0f1720" opacity=".35"/>

  <!-- electrodo -->
  <path d="M236 226 C 296 226, 300 288, 330 306 C 348 317, 364 314, 376 302"
        fill="none" stroke="#e8f4f6" stroke-width="17" stroke-linecap="round"/>
  <circle cx="381" cy="298" r="15" fill="#e8f4f6"/>

  <!-- trazado electrocardiográfico -->
  <path d="M104 372 H172 l22 -54 l26 108 l24 -76 l20 34 H408"
        fill="none" stroke="#2fd3c8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
